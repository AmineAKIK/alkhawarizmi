<!--
  GitHub Pages serves this file for unknown paths. It stores the requested
  local SPA path in ?redirect= and sends the browser back to index.html,
  where App.tsx restores the route.

  The project-page base is derived from the first pathname segment instead of
  hard-coding the repository name, so repository renames do not break deep
  links. Custom-domain deployments use the domain root as their base.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Redirection…</title>
  </head>
  <body>
    <script>
      const { hostname, pathname, search, hash } = window.location;
      const segments = pathname.split("/").filter(Boolean);
      const isGitHubProjectPage = hostname.endsWith(".github.io") && segments.length > 0;
      const base = isGitHubProjectPage ? `/${segments[0]}` : "";
      const localPath = pathname.slice(base.length) || "/";
      const redirect = encodeURIComponent(localPath + search + hash);

      window.location.replace(`${base}/?redirect=${redirect}`);
    </script>
  </body>
</html>
